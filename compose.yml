# One install: web + worker + postgres. TLS and the public hostname belong to the host's
# reverse proxy (Traefik under Coolify, or Caddy); point it at web:8000.
name: htr

services:
  web:
    build: .
    env_file: .env
    environment:
      HTR_DATABASE_URL: postgresql+psycopg://htr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/htr
    command: ["python", "-m", "uvicorn", "--factory", "htr.web.app:create_app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./install.yaml:/app/install.yaml:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      HTR_DATABASE_URL: postgresql+psycopg://htr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/htr
    command: ["python", "-m", "htr.worker"]
    volumes:
      - ./install.yaml:/app/install.yaml:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: htr
      POSTGRES_USER: htr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - htr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U htr -d htr"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  htr-postgres:
