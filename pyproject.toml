[project]
name = "htr"
version = "0.1.0"
description = "Hold the Room: an assistant that reads everything, drafts everything, and sends nothing until the owner rules."
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2.0", "pyyaml", "httpx", "tzdata"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
